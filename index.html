<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeMax</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>PokeMax</h1>
        <p>La mejor forma de buscar pokémon</p>
    </header>

    <div class="busqueda">
        <h1>Busca tu pokémon</h1>
        <p>Por nombre o ID</p>
        <!-- onsubmit="return false;" evita que la página se recargue al presionar Enter -->
        <form onsubmit="return false;">
            <input type="text" id="inputPokemon" placeholder="Ej: Pikachu, 25">
            <!-- type="button" evita conflictos con el eventListener de tu app.js -->
            <button type="button" id="botonBusqueda">Buscar</button>
        </form>
    </div>

    <div id="resultado"></div>

    <!-- TODOS los scripts deben ir justo antes de cerrar el <body> -->
    <script src="script.js"></script>
    <script type="module" src="./tests/index.js"></script> 
</body>
</html>
